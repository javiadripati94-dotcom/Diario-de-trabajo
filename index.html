<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agenda Pro">
<meta name="theme-color" content="#000000">
<title>Agenda Pro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--sub:#8e8e93;--line:#e3e3e8;--fill:#e9e9ee;--acc:#0a84ff;--per:#0a84ff;--biz:#f2c200;--red:#ff3b30;--green:#34c759;--yellow:#ffcc00;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05)}
[data-theme=dark]{--bg:#000;--card:#1c1c1e;--text:#f2f2f7;--sub:#8e8e93;--line:#2c2c2e;--fill:#2c2c2e;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);padding:calc(env(safe-area-inset-top) + 8px) 16px 8px}
.hrow{display:flex;align-items:center;gap:8px}
.htitle{font-size:30px;font-weight:800;letter-spacing:-.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsub{color:var(--sub);font-size:14px;font-weight:600}.hsub::first-letter{text-transform:uppercase}
.ibtn{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;background:var(--fill);color:var(--acc);flex:none}
.ibtn svg{width:19px;height:19px}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;margin-top:8px}
.seg button{flex:1;padding:6px 4px;border-radius:7px;font-size:13px;font-weight:600;color:var(--text)}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
[data-theme=dark] .seg button.on{background:#636366}
main{padding:4px 16px calc(env(safe-area-inset-bottom) + 110px);max-width:760px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom) + 6px)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--sub)}
.tabbar button svg{width:25px;height:25px}
.tabbar button.on{color:var(--acc)}
.tabbar .badge{position:absolute;margin-left:18px;margin-top:-2px;background:var(--red);color:#fff;font-size:10px;border-radius:9px;padding:0 5px;min-width:16px;line-height:16px}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:31;width:58px;height:58px;border-radius:29px;background:var(--acc);color:#fff;display:grid;place-items:center;box-shadow:0 6px 20px rgba(10,132,255,.45)}
.fab svg{width:28px;height:28px}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.sec{margin:20px 0 6px;display:flex;align-items:baseline;justify-content:space-between}
.sec h3{margin:0;font-size:20px;font-weight:700}
.sec .lnk{color:var(--acc);font-size:15px}
.muted{color:var(--sub)}
.small{font-size:13px}
.row{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;border-bottom:.5px solid var(--line);position:relative;cursor:pointer}
.row:last-child{border-bottom:0}
.row:active{background:var(--fill)}
.chk{width:24px;height:24px;border-radius:12px;border:2px solid var(--sub);flex:none;margin-top:1px;display:grid;place-items:center}
.chk.p3{border-color:var(--red)}.chk.p2{border-color:var(--biz)}.chk.p1{border-color:var(--acc)}
.done .chk{background:var(--green);border-color:var(--green)}
.done .chk::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.done .rt{text-decoration:line-through;color:var(--sub)}
.evbar{width:4px;align-self:stretch;border-radius:2px;flex:none;margin:2px 10px 2px 10px}
.rbody{flex:1;min-width:0}
.rt{font-size:16px;word-wrap:break-word}
.rm{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;font-size:13px;color:var(--sub);align-items:center}
.rm .late{color:var(--red);font-weight:600}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 7px;border-radius:6px}
.tag.per{background:color-mix(in srgb,var(--per) 15%,transparent);color:var(--per)}
.tag.biz{background:color-mix(in srgb,var(--biz) 22%,transparent);color:#7a6100}
[data-theme=dark] .tag.biz{color:var(--biz)}
.dot{width:8px;height:8px;border-radius:4px;display:inline-block;flex:none}
.rtime{font-size:13px;font-weight:600;color:var(--text);min-width:44px;text-align:right;margin-top:2px}
.empty{padding:26px 16px;text-align:center;color:var(--sub);font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.stat{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow);cursor:pointer}
.stat b{display:block;font-size:26px;font-weight:800}
.stat span{font-size:12.5px;color:var(--sub);font-weight:600}
.quick{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:14px;padding:8px 8px 8px 14px;box-shadow:var(--shadow);margin-top:10px}
.quick input{flex:1;border:0;outline:0;background:none;font-size:16px;min-width:0}
.quick button{background:var(--acc);color:#fff;border-radius:10px;padding:7px 12px;font-weight:600;font-size:14px}
.qprev{display:flex;flex-wrap:wrap;gap:6px;margin:8px 2px 0;font-size:13px}
.qprev span{background:var(--fill);border-radius:8px;padding:2px 8px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;background:var(--card);border:.5px solid var(--line);border-radius:16px;padding:5px 11px;font-size:13.5px;font-weight:500}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.prog{height:6px;background:var(--fill);border-radius:3px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--green);border-radius:3px;transition:width .3s}
/* calendar */
.calnav{display:flex;align-items:center;gap:8px;margin:10px 0 8px}
.calnav .t{flex:1;font-size:19px;font-weight:700;text-transform:capitalize}
.calnav .tb{color:var(--acc);font-weight:600;font-size:15px;padding:6px 10px;background:var(--fill);border-radius:8px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);background:var(--card);border-radius:14px;padding:6px;box-shadow:var(--shadow)}
.mgrid .wd{text-align:center;font-size:12px;font-weight:600;color:var(--sub);padding:4px 0}
.mc{min-height:52px;display:flex;flex-direction:column;align-items:center;padding:3px 0;border-radius:10px;cursor:pointer}
.mc .n{width:30px;height:30px;border-radius:15px;display:grid;place-items:center;font-size:16px;font-weight:500}
.mc.out{opacity:.32}
.mc.today .n{color:var(--red);font-weight:800}
.mc.sel .n{background:var(--text);color:var(--bg);font-weight:700}
.mc.today.sel .n{background:var(--red);color:#fff}
.mc .ds{display:flex;gap:2px;margin-top:3px;height:6px}
.mc .ds i{width:6px;height:6px;border-radius:3px}
.mc.we .n{color:var(--sub)}
.ygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ym{background:var(--card);border-radius:14px;padding:10px;box-shadow:var(--shadow)}
.ym h4{margin:0 0 6px;font-size:15px;color:var(--red);text-transform:capitalize;cursor:pointer}
.ym .g{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.ym .g span{font-size:10px;text-align:center;line-height:17px;border-radius:4px;cursor:pointer}
.ym .g span.t{background:var(--red);color:#fff;font-weight:700}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px}
.wstrip button{display:flex;flex-direction:column;align-items:center;padding:6px 0;border-radius:12px;background:var(--card);box-shadow:var(--shadow)}
.wstrip button small{font-size:11px;color:var(--sub);font-weight:600;text-transform:uppercase}
.wstrip button b{font-size:18px}
.wstrip button.today b{color:var(--red)}
.wstrip button.sel{background:var(--acc);color:#fff}.wstrip button.sel small,.wstrip button.sel b{color:#fff}
.wstrip button em{font-style:normal;font-size:10px;color:var(--sub);height:12px}
.wstrip button.sel em{color:#fff}
.dayh{font-size:14px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.3px;margin:16px 4px 6px;display:flex;justify-content:space-between}
.dayh.today{color:var(--red)}
.tl{position:relative;background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.tl .hr{height:56px;border-top:.5px solid var(--line);position:relative;cursor:pointer}
.tl .hr:first-child{border-top:0}
.tl .hr span{position:absolute;left:8px;top:-8px;font-size:11px;color:var(--sub);background:var(--card);padding:0 3px}
.tl .hr:first-child span{top:2px}
.tl .ev{position:absolute;left:54px;right:8px;border-radius:7px;padding:3px 7px;font-size:13px;overflow:hidden;cursor:pointer;border-left:3px solid}
.tl .ev b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .ev.done{opacity:.5;text-decoration:line-through}
.tl .now{position:absolute;left:48px;right:0;height:2px;background:var(--red);z-index:3}
.tl .now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:5px;background:var(--red)}
.tl .off{background:repeating-linear-gradient(-45deg,transparent 0 6px,color-mix(in srgb,var(--fill) 60%,transparent) 6px 7px)}
/* notes */
.ncomp{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px;margin-top:10px}
.ncomp textarea{width:100%;border:0;outline:0;background:none;resize:none;min-height:70px;font-size:16px}
.ncomp .bar{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.btn{background:var(--acc);color:#fff;border-radius:10px;padding:8px 14px;font-weight:600;font-size:15px}
.btn.sec2{background:var(--fill);color:var(--acc)}
.btn.red{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.btn.full{width:100%;padding:13px;font-size:16px;border-radius:12px}
.ngrid{columns:2 160px;column-gap:10px;margin-top:12px}
.note{break-inside:avoid;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px;margin-bottom:10px;border-top:4px solid var(--per)}
.note.biz{border-top-color:var(--biz)}
.note p{margin:0;white-space:pre-wrap;word-wrap:break-word;font-size:15px}
.note .nb{display:flex;gap:4px;margin-top:10px;align-items:center}
.note .nb button{font-size:12.5px;color:var(--acc);font-weight:600;padding:3px 6px;border-radius:6px;background:var(--fill)}
.note .nb .d{margin-left:auto;font-size:11px;color:var(--sub)}
/* list settings */
.list .li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:.5px solid var(--line);min-height:48px}
.list .li:last-child{border-bottom:0}
.list .li .l{flex:1}
.list .li select,.list .li input[type=text],.list .li input[type=number]{border:0;background:none;text-align:right;outline:0;color:var(--sub);font-size:15px;max-width:55%}
.list .li .chev{color:var(--sub)}
.ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.ico svg{width:17px;height:17px}
.hint{font-size:13px;color:var(--sub);margin:6px 14px 0}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:94vh;background:var(--bg);border-radius:14px 14px 0 0;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;max-width:760px;margin:0 auto}
.sheet.on{transform:none}
.sh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.sh b{font-size:17px}
.sh button{color:var(--acc);font-size:17px}
.sh .save{font-weight:700}
.sb{overflow-y:auto;padding:0 16px calc(env(safe-area-inset-bottom) + 24px);-webkit-overflow-scrolling:touch}
.fg{background:var(--card);border-radius:12px;margin-top:14px;overflow:hidden}
.fr{display:flex;align-items:center;gap:10px;padding:0 14px;min-height:46px;border-bottom:.5px solid var(--line)}
.fr:last-child{border-bottom:0}
.fr label{flex:1;font-size:16px}
.fr input,.fr select{border:0;outline:0;background:none;text-align:right;font-size:16px;color:var(--sub);min-width:0;max-width:62%}
.fr input[type=date],.fr input[type=time]{color:var(--acc);-webkit-appearance:none;appearance:none;min-height:38px;background:var(--fill);border-radius:9px;padding:6px 12px;font-weight:600;font-size:17px;min-width:120px;text-align:center}
.fr label[for]{cursor:pointer}
.remgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px}
.remgrid button{padding:12px 2px;border-radius:11px;background:var(--fill);font-size:14px;font-weight:600;color:var(--text)}
.remgrid button.on{background:var(--acc);color:#fff}
.remgrid button.off.on{background:#8e8e93}
.remhint{padding:0 14px 13px;font-size:14px;color:var(--sub)}
.remhint b{color:var(--text)}
.fr input.big{text-align:left;max-width:none;flex:1;color:var(--text);font-size:17px;padding:12px 0}
.fr textarea{flex:1;border:0;outline:0;background:none;resize:vertical;min-height:80px;padding:12px 0;font-size:16px}
.fr .seg{margin:6px 0;flex:1}
.sw{position:relative;width:51px;height:31px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;background:var(--fill);border-radius:16px;transition:.2s}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s}
.sw input:checked+i{background:var(--green)}
.sw input:checked+i::after{transform:translateX(20px)}
.sub{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:.5px solid var(--line)}
.sub input[type=text]{flex:1;border:0;outline:0;background:none;font-size:15px;text-align:left;max-width:none;color:var(--text)}
.sub .chk{width:20px;height:20px}
.sub.done .chk{background:var(--green);border-color:var(--green)}
.x{color:var(--sub);font-size:20px;line-height:1;padding:0 4px}
.flbl{font-size:13px;color:var(--sub);text-transform:uppercase;margin:18px 14px -8px;font-weight:500}
.ext{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.ext a{font-size:14px;color:var(--acc);text-decoration:none;background:var(--card);padding:6px 10px;border-radius:9px}
/* modal / alert */
.modal{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:24px;background:rgba(0,0,0,.45)}
.modal.on{display:grid}
.mbox{background:var(--card);border-radius:18px;width:100%;max-width:340px;padding:20px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mbox h2{margin:6px 0 4px;font-size:19px}
.mbox p{margin:0 0 14px;color:var(--sub);font-size:14px}
.mbox .bell{width:52px;height:52px;border-radius:26px;background:color-mix(in srgb,var(--biz) 18%,transparent);color:var(--biz);display:grid;place-items:center;margin:0 auto;animation:ring 1s ease-in-out 2}
.mbox .bell svg{width:28px;height:28px}
.mbox .acts{display:grid;gap:8px}
.mbox .acts2{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(15deg)}40%{transform:rotate(-15deg)}60%{transform:rotate(10deg)}80%{transform:rotate(-6deg)}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%) translateY(20px);background:#1c1c1ef0;color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:.25s;z-index:70;max-width:92vw}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{color:#64d2ff;font-weight:700}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding:14px 14px 4px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars i{width:100%;background:var(--acc);border-radius:5px 5px 2px 2px;min-height:3px}
.bars small{font-size:11px;color:var(--sub)}
.bars b{font-size:11px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.kpi b{font-size:24px;font-weight:800;display:block}
.kpi span{font-size:13px;color:var(--sub)}
.steps{margin:0;padding:10px 14px 12px 34px;font-size:15px}
.steps li{margin:6px 0}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.sync i{width:7px;height:7px;border-radius:4px;background:var(--sub)}
.sync.ok i{background:var(--green)}
.brand{display:flex;align-items:center;gap:8px;margin-bottom:4px;min-height:24px}
.flag{width:24px;height:16px;border-radius:3px;overflow:hidden;flex:none;box-shadow:0 0 0 .5px rgba(0,0,0,.2)}
.blogo{height:24px;display:flex;align-items:center;gap:6px;font-weight:900;font-size:15px;letter-spacing:.4px}
.blogo img{height:26px;max-width:150px;object-fit:contain}
.blogo .lg{width:28px;height:28px;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.3);flex:none}
.blogo .w1{color:var(--text)}
.hero{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#1c1c1e,#2c2c2e);color:#fff;border-radius:16px;padding:14px;margin-top:8px;position:relative;overflow:hidden}
.hero{background:linear-gradient(135deg,#0b0b0b,#262626)!important;border:1px solid rgba(255,204,0,.35)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;background:radial-gradient(circle,rgba(255,204,0,.32),transparent 70%)}
.hero img{width:72px;height:72px;object-fit:contain;border-radius:36px;flex:none;position:relative;z-index:1;box-shadow:0 0 0 2px #ffcc00,0 4px 14px rgba(255,204,0,.35)}
.hero img.custom{border-radius:12px;background:#fff;padding:4px;box-shadow:none}
.hero b{font-size:19px;letter-spacing:.6px}.hero small{display:block;color:#ffcc00;font-size:12.5px;font-weight:600}.hero em{display:block;font-style:normal;color:#bbb;font-size:11px;letter-spacing:.3px;text-transform:uppercase;margin-top:2px}
.greet{font-size:15px;color:var(--sub);margin-top:2px}
@media (min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="main"></main>
<button class="fab" id="fab" aria-label="Nuevo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="tabbar" id="tabs"></nav>
<div class="ov" id="ov"></div>
<div class="sheet" id="sheet"></div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<input type="file" id="logoIn" accept="image/*" hidden>

<script>
"use strict";
/* ================= utilidades ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const addMonths=(d,n)=>{const x=new Date(d);const day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+n);const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(day,last));return x;};
const todayStr=()=>ymd(new Date());
const diffDays=(a,b)=>Math.round((parseYmd(b)-parseYmd(a))/864e5);
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const DOW=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DOWS=['L','M','X','J','V','S','D'];
const DOW3=['lun','mar','mié','jue','vie','sáb','dom'];
const MON=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function startOfWeek(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
const toMin=t=>{if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+m;};
const fromMin=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
function fmtDateLong(ds){const d=parseYmd(ds);return DOW[d.getDay()]+', '+d.getDate()+' de '+MON[d.getMonth()];}
function relDay(ds){const t=todayStr();const k=diffDays(t,ds);if(k===0)return'Hoy';if(k===1)return'Mañana';if(k===-1)return'Ayer';if(k===2)return'Pasado mañana';if(k>2&&k<7)return DOW[parseYmd(ds).getDay()].replace(/^./,c=>c.toUpperCase());const d=parseYmd(ds);return d.getDate()+' '+MON[d.getMonth()].slice(0,3)+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'');}

const Store={mode:'local',itemsCol:null,notesCol:null,setRef:null,q:{},
 loadLocal(){const d=lsGet('agp_v1',null);if(d){S.items=d.items||[];S.notes=d.notes||[];S.settings=Object.assign(defaults(),d.settings||{});}},
 persist(){lsSet('agp_v1',{items:S.items,notes:S.notes,settings:S.settings});},
 write(col,id,data){if(this.mode!=='cloud'||!col)return;const ref=col.doc(id);const body=data?JSON.parse(JSON.stringify(data)):null;
  this.q[id]=(this.q[id]||Promise.resolve()).then(()=>body?ref.set(body):ref.delete()).catch(e=>{if(e&&e.code==='quota_exceeded')toast('Espacio lleno: borra cosas antiguas');else if(e&&e.code==='unavailable'){setTimeout(()=>this.write(col,id,data),1500+Math.random()*1500);}});},
 putItem(it){it.updated=Date.now();const i=S.items.findIndex(x=>x.id===it.id);if(i>=0)S.items[i]=it;else S.items.push(it);this.persist();this.write(this.itemsCol,it.id,it);render();},
 delItem(id){S.items=S.items.filter(x=>x.id!==id);this.persist();this.write(this.itemsCol,id,null);render();},
 putNote(n){n.updated=Date.now();const i=S.notes.findIndex(x=>x.id===n.id);if(i>=0)S.notes[i]=n;else S.notes.push(n);this.persist();this.write(this.notesCol,n.id,n);render();},
 delNote(id){S.notes=S.notes.filter(x=>x.id!==id);this.persist();this.write(this.notesCol,id,null);render();},
 _st:null,
 putSettings(){this.persist();applyTheme();if(this.mode!=='cloud')return;clearTimeout(this._st);this._st=setTimeout(()=>{const b=JSON.parse(JSON.stringify(S.settings));this.q.__s=(this.q.__s||Promise.resolve()).then(()=>this.setRef.set(b)).catch(()=>{});},600);}
};
async function initCloud(){
 if(!window.claude||typeof window.claude.use!=='function'){S.sync='local';return;}
 try{
  const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
  if(!db||!user){S.sync='local';render();return;}
  const uid=await user.id();
  if(!uid){S.sync='local';render();return;}
  const base='data/users/'+uid;
  Store.itemsCol=db.doc(base+'/profile').collection('items');
  Store.notesCol=db.doc(base+'/profile').collection('notes');
  Store.setRef=db.doc(base+'/settings');
  Store.mode='cloud';S.sync='connecting';render();
  const tmr=setTimeout(()=>{if(S.sync==='connecting'){S.sync='slow';render();}},10000);
  const migrated=lsGet('agp_migrated_'+uid,false);
  const localItems=S.items.slice(),localNotes=S.notes.slice();
  let firstI=true,firstN=true;
  Store.itemsCol.onSnapshot(snap=>{
   if(firstI&&!snap.metadata.fromCache){firstI=false;clearTimeout(tmr);S.sync='ok';
    if(snap.empty&&!migrated&&localItems.length){localItems.forEach(it=>Store.write(Store.itemsCol,it.id,it));lsSet('agp_migrated_'+uid,true);return;}
    lsSet('agp_migrated_'+uid,true);}
   if(snap.empty&&snap.metadata.fromCache&&S.items.length)return;
   S.items=snap.docs.map(d=>Object.assign({},d.data()));Store.persist();render();checkReminders();
  },e=>{S.sync='error';render();});
  Store.notesCol.onSnapshot(snap=>{
   if(firstN&&!snap.metadata.fromCache){firstN=false;if(snap.empty&&!migrated&&localNotes.length){localNotes.forEach(n=>Store.write(Store.notesCol,n.id,n));return;}}
   if(snap.empty&&snap.metadata.fromCache&&S.notes.length)return;
   S.notes=snap.docs.map(d=>Object.assign({},d.data()));Store.persist();render();
  },()=>{});
  try{const s=await Store.setRef.get();if(s.exists){S.settings=Object.assign(defaults(),s.data());S.settings.cats.forEach(c=>{if(c.color==='#ff9f0a')c.color='#f2c200';});Store.persist();applyTheme();render();}else{await Store.setRef.set(JSON.parse(JSON.stringify(S.settings)));}}catch(e){}
 }catch(e){S.sync='local';Store.mode='local';render();}
}

/* ================= lógica de agenda ================= */
function occursOn(it,ds){
 if(!it.date)return false;
 if(it.skip&&it.skip.includes(ds))return false;
 const rep=it.rep||'none';
 if(rep==='none')return it.date===ds;
 if(ds<it.date)return false;
 if(it.until&&ds>it.until)return false;
 const d=parseYmd(ds),s=parseYmd(it.date);
 switch(rep){
  case'daily':return true;
  case'weekdays':{const w=d.getDay();return w>0&&w<6;}
  case'weekly':return d.getDay()===s.getDay();
  case'biweekly':return d.getDay()===s.getDay()&&diffDays(it.date,ds)%14===0;
  case'monthly':return monthlyMatch(s,d,1);
  case'quarterly':return monthlyMatch(s,d,3);
  case'yearly':return d.getMonth()===s.getMonth()&&monthlyMatch(s,d,1);
 }return false;
}
function monthlyMatch(s,d,step){
 const months=(d.getFullYear()-s.getFullYear())*12+d.getMonth()-s.getMonth();
 if(months%step!==0)return false;
 const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
 return d.getDate()===Math.min(s.getDate(),last);
}
const isRec=it=>(it.rep||'none')!=='none';

function itemsOn(ds,all){return S.items.filter(it=>(all||areaOk(it))&&occursOn(it,ds)).sort(byTime);}

/* ================= entrada rápida en lenguaje natural ================= */
function parseQuick(raw){
 let t=' '+raw.replace(/\s+/g,' ').trim()+' ';const r={};
 const today=new Date();today.setHours(0,0,0,0);
 const take=(re,fn)=>{const m=t.match(re);if(m){fn(m);t=t.replace(m[0],' ');return true;}return false;};
 const setTime=(h,m,pm)=>{h=+h;m=+(m||0);if(pm&&h<12)h+=12;if(h<24&&m<60)r.time=pad(h)+':'+pad(m);};
 take(/\s(cada d[ií]a|diariamente|todos los d[ií]as)\s/i,()=>r.rep='daily');
 take(/\s(laborables|entre semana|de lunes a viernes)\s/i,()=>r.rep='weekdays');
 take(/\s(cada dos semanas|cada 2 semanas|quincenal(mente)?)\s/i,()=>r.rep='biweekly');
 take(/\s(cada semana|semanalmente|todas las semanas)\s/i,()=>r.rep='weekly');
 take(/\s(cada trimestre|trimestral(mente)?|cada 3 meses)\s/i,()=>r.rep='quarterly');
 take(/\s(cada mes|mensualmente|todos los meses)\s/i,()=>r.rep='monthly');
 take(/\s(cada a[ñn]o|anualmente|todos los a[ñn]os)\s/i,()=>r.rep='yearly');
 take(/\saviso (\d+)\s?(min|minutos|h|horas?|d|d[ií]as?)?\s/i,m=>{let n=+m[1];const u=norm(m[2]||'min');if(u[0]==='h')n*=60;else if(u[0]==='d')n*=1440;r.remind=n;});
 take(/\ssin aviso\s/i,()=>r.remind=-1);
 take(/\sen (\d+)\s?(min|minutos|h|horas?)\s/i,m=>{const ms=+m[1]*(norm(m[2])[0]==='h'?36e5:6e4);const d=new Date(Date.now()+ms);r.date=ymd(d);r.time=pad(d.getHours())+':'+pad(d.getMinutes());});
 take(/\spor la ma[ñn]ana\s/i,()=>{r.time=r.time||'09:00';});
 take(/\s(a )?medio ?d[ií]a\s/i,()=>{r.time=r.time||'13:00';});
 const pmT=take(/\spor la tarde\s/i,()=>{});
 const pmN=take(/\spor la noche\s/i,()=>{});
 const pm=take(/\sde la (tarde|noche)\s/i,()=>{})||pmT||pmN;
 take(/\spasado ma[ñn]ana\s/i,()=>r.date=ymd(addDays(today,2)));
 take(/\shoy\s/i,()=>r.date=ymd(today));
 take(/\sayer\s/i,()=>r.date=ymd(addDays(today,-1)));
 take(/\sma[ñn]ana\s/i,()=>r.date=ymd(addDays(today,1)));
 take(/\s(este |el |la |pr[oó]ximo |pr[oó]xima |el pr[oó]ximo )?(fin de semana)\s/i,()=>{let d=addDays(today,0);while(d.getDay()!==6)d=addDays(d,1);r.date=ymd(d);});
 take(/\s(el |este |pr[oó]ximo |el pr[oó]ximo )?(lunes|martes|mi[ée]rcoles|jueves|viernes|s[áa]bado|domingo)\s/i,m=>{const k=['domingo','lunes','martes','miercoles','jueves','viernes','sabado'].indexOf(norm(m[2]));let d=addDays(today,1);while(d.getDay()!==k)d=addDays(d,1);r.date=ymd(d);});
 take(/\s(el |la )?(semana que viene|pr[oó]xima semana)\s/i,()=>{r.date=ymd(addDays(startOfWeek(today),7));});
 take(/\s(el )?(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?\s/,m=>{let y=m[4]?+m[4]:today.getFullYear();if(y<100)y+=2000;const d=new Date(y,+m[3]-1,+m[2]);if(!m[4]&&d<today)d.setFullYear(y+1);if(!isNaN(d))r.date=ymd(d);});
 take(/\s(el )?(\d{1,2}) de (enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)\s/i,m=>{let mi=MON.indexOf(norm(m[3]));if(mi<0)mi=8;const d=new Date(today.getFullYear(),mi,+m[2]);if(d<today)d.setFullYear(d.getFullYear()+1);r.date=ymd(d);});
 take(/\s(el )?d[ií]a (\d{1,2})\s/i,m=>{const n=+m[2];let d=new Date(today.getFullYear(),today.getMonth(),n);if(d<today)d=new Date(today.getFullYear(),today.getMonth()+1,n);r.date=ymd(d);});
 if(!take(/\sde (\d{1,2})(?:[:.](\d{2}))? a (\d{1,2})(?:[:.](\d{2}))?\s?h?\s/i,m=>{setTime(m[1],m[2],pm);const st=r.time;setTime(m[3],m[4],pm);r.end=r.time;r.time=st;})){
  take(/\sa las? (\d{1,2})(?:[:.](\d{2}))?\s?h?\s/i,m=>setTime(m[1],m[2],pm))||
  take(/\s(\d{1,2})[:.](\d{2})\s?h?\s/,m=>setTime(m[1],m[2],pm))||
  take(/\s(\d{1,2})\s?h\s/i,m=>setTime(m[1],0,pm));
 }
 if(pmT&&!r.time)r.time='17:00';if(pmN&&!r.time)r.time='21:00';
 take(/\s(!!!|!alta|!urgente|urgente)\s/i,()=>r.prio=3);
 take(/\s(!!|!media)\s/i,()=>r.prio=2);
 take(/\s(!|!baja)\s/i,()=>r.prio=1);
 let m;while((m=t.match(/\s#([\wáéíóúñü\-]+)/i))){const tg=norm(m[1]);t=t.replace(m[0],' ');
  if(['empresa','trabajo','curro','obra','negocio','cliente','biz',norm(S.settings.bizName)].includes(tg))r.area='biz';
  else if(['personal','yo','familia','privado'].includes(tg))r.area='per';
  else{const c=S.settings.cats.find(c=>norm(c.name).startsWith(tg)||norm(c.name).replace(/\s/g,'')===tg);if(c){r.cat=c.id;if(!r.area)r.area=c.area;}}}
 if(/\s(cita|reuni[oó]n|quedada|comida con|cena con)\s/i.test(t))r.type='event';
 take(/\sevento\s/i,()=>r.type='event');
 if(r.time&&!r.date)r.date=ymd(today);
 r.title=t.replace(/\s+/g,' ').trim();
 r.title=r.title.charAt(0).toUpperCase()+r.title.slice(1);
 return r;
}
function quickPreview(p){const a=[];if(p.date)a.push('📅 '+relDay(p.date));if(p.time)a.push('🕒 '+p.time+(p.end?'–'+p.end:''));if(p.rep)a.push('🔁 '+REP[p.rep]);if(p.prio)a.push('❗ '+PRIO[p.prio]);if(p.area)a.push(p.area==='biz'?'💼 '+areaName('biz'):'🏠 Personal');if(p.cat)a.push('🏷 '+(catOf(p.cat)||{}).name);if(p.remind!=null)a.push('🔔 '+REM[String(p.remind)]);return a;}

let fired=lsGet('agp_fired',{}),snoozes=lsGet('agp_snooze',[]),alertQ=[],alertOn=false;
function startOf(it,ds){const d=parseYmd(ds);const t=(!it.allDay&&it.time)?it.time:S.settings.allDayHour||'09:00';const[h,m]=t.split(':').map(Number);d.setHours(h,m,0,0);return d;}
function checkReminders(){
 const now=Date.now(),t0=new Date();t0.setHours(0,0,0,0);
 for(let k=-1;k<=8;k++){const ds=ymd(addDays(t0,k));
  for(const it of S.items){if(it.remind==null||it.remind<0)continue;if(!occursOn(it,ds)||isDone(it,ds))continue;
   const at=startOf(it,ds).getTime()-it.remind*6e4;const key=it.id+'|'+ds;
   if(at<=now&&now-at<12*36e5&&!fired[key]&&!((it.created||0)>at+6e4&&(it.updated||0)>at+6e4)){fired[key]=now;queueAlert(it.id,ds);}}}
 snoozes=snoozes.filter(s=>{if(s.at<=now){queueAlert(s.id,s.ds);return false;}return true;});
 const lim=now-10*864e5;for(const k in fired)if(fired[k]<lim)delete fired[k];
 lsSet('agp_fired',fired);lsSet('agp_snooze',snoozes);
}
function queueAlert(id,ds){if(!alertQ.some(a=>a.id===id&&a.ds===ds))alertQ.push({id,ds});if(!alertOn)nextAlert();}
function nextAlert(){const a=alertQ.shift();if(!a){alertOn=false;$('#modal').classList.remove('on');return;}
 const it=S.items.find(x=>x.id===a.id);if(!it){nextAlert();return;}alertOn=true;
 const when=(it.time&&!it.allDay)?relDay(a.ds)+' a las '+it.time:relDay(a.ds);
 $('#mbox').innerHTML=`<div class="bell">${IC.bell}</div><h2>${esc(it.title)}</h2><p>${esc(when)} · ${esc(areaName(it.area))}${it.client?' · '+esc(it.client):''}${it.addr?'<br>'+esc(it.addr):''}</p>
 <div class="acts"><button class="btn full" data-act="alDone" data-id="${it.id}" data-date="${a.ds}">✓ Hecho</button>
 <div class="acts2"><button class="btn sec2" data-act="alSnooze" data-m="10" data-id="${it.id}" data-date="${a.ds}">+10 min</button><button class="btn sec2" data-act="alSnooze" data-m="60" data-id="${it.id}" data-date="${a.ds}">+1 hora</button><button class="btn sec2" data-act="alSnooze" data-m="tom" data-id="${it.id}" data-date="${a.ds}">Mañana</button></div>
 <button class="btn sec2 full" data-act="alOpen" data-id="${it.id}" data-date="${a.ds}">Abrir</button>
 <button class="btn sec2 full" data-act="alClose">Cerrar</button></div>`;
 $('#modal').classList.add('on');beep();
 notify(it.title,when+(it.client?' · '+it.client:''),it.id+a.ds);
 try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}
}
let actx=null;
function unlockAudio(){if(actx)return;try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function beep(){if(!S.settings.sound||!actx)return;try{actx.resume();[0,.22,.44].forEach((d,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=i===2?1175:880;g.gain.setValueAtTime(.0001,actx.currentTime+d);g.gain.exponentialRampToValueAtTime(.3,actx.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d+.2);o.connect(g).connect(actx.destination);o.start(actx.currentTime+d);o.stop(actx.currentTime+d+.22);});}catch(e){}}

function calTitle(){const c=parseYmd(S.cursor);if(S.cal==='dia')return fmtDateLong(S.cursor)+(c.getFullYear()!==new Date().getFullYear()?' '+c.getFullYear():'');if(S.cal==='semana'){const a=startOfWeek(c),b=addDays(a,6);return a.getDate()+(a.getMonth()!==b.getMonth()?' '+MON[a.getMonth()].slice(0,3):'')+' – '+b.getDate()+' '+MON[b.getMonth()].slice(0,3)+' '+b.getFullYear();}if(S.cal==='mes')return MON[c.getMonth()]+' '+c.getFullYear();return String(c.getFullYear());}
function vCal(){return`<div class="calnav"><button class="ibtn" data-act="calnav" data-v="-1">${IC.left}</button><div class="t">${esc(calTitle())}</div><button class="tb" data-act="calToday">Hoy</button><button class="ibtn" data-act="calnav" data-v="1">${IC.right}</button></div>`+(S.cal==='dia'?vDia():S.cal==='semana'?vSemana():S.cal==='mes'?vMes():vAno());}
function dayDots(ds){const its=itemsOn(ds);const cols=[];its.slice(0,4).forEach(it=>{const c=catOf(it.cat);cols.push(c?c.color:it.area==='biz'?'var(--biz)':'var(--per)');});return{n:its.length,cols};}
function vMes(){const c=parseYmd(S.cursor);const first=new Date(c.getFullYear(),c.getMonth(),1);const start=startOfWeek(first);const t=todayStr();
 let h=DOWS.map(d=>`<div class="wd">${d}</div>`).join('');
 for(let i=0;i<42;i++){const d=addDays(start,i);const ds=ymd(d);if(i===35&&d.getMonth()!==c.getMonth())break;const dd=dayDots(ds);
  h+=`<div class="mc ${d.getMonth()!==c.getMonth()?'out':''} ${ds===t?'today':''} ${ds===S.cursor?'sel':''} ${d.getDay()%6===0?'we':''}" data-act="pick" data-date="${ds}"><div class="n">${d.getDate()}</div><div class="ds">${dd.cols.map(x=>`<i style="background:${x}"></i>`).join('')}</div></div>`;}
 const its=itemsOn(S.cursor);
 return`<div class="mgrid">${h}</div><div class="dayh ${S.cursor===t?'today':''}"><span>${esc(relDay(S.cursor))} · ${esc(fmtDateLong(S.cursor))}</span><button class="lnk" style="color:var(--acc)" data-act="openDay" data-date="${S.cursor}">Ver horas</button></div>${listCard(its.map(it=>rowHTML(it,S.cursor,{timeCol:1})),`Día libre · <a href="#" data-act="newOn" data-date="${S.cursor}" style="color:var(--acc)">Añadir</a>`)}`;}
function vSemana(){const a=startOfWeek(parseYmd(S.cursor));const t=todayStr();let strip='',body='';
 for(let i=0;i<7;i++){const d=addDays(a,i),ds=ymd(d);const its=itemsOn(ds);
  strip+=`<button class="${ds===t?'today':''} ${ds===S.cursor?'sel':''}" data-act="pickw" data-date="${ds}"><small>${DOWS[i]}</small><b>${d.getDate()}</b><em>${its.length?its.length:''}</em></button>`;
  body+=`<div class="dayh ${ds===t?'today':''}"><span>${DOW3[i]} ${d.getDate()} ${MON[d.getMonth()].slice(0,3)}${ds===t?' · Hoy':''}</span><button style="color:var(--acc);font-weight:700" data-act="newOn" data-date="${ds}">＋</button></div>${its.length?listCard(its.map(it=>rowHTML(it,ds,{timeCol:1})),''):''}`;}
 return`<div class="wstrip">${strip}</div>${body}`;}
function vDia(){const ds=S.cursor;const its=itemsOn(ds);const timed=its.filter(i=>i.time&&!i.allDay),untimed=its.filter(i=>!i.time||i.allDay);const H=56;
 const ws=toMin(S.settings.workStart)||0,we=toMin(S.settings.workEnd)||1440;
 let hrs='';for(let h=0;h<24;h++)hrs+=`<div class="hr ${(h*60<ws||h*60>=we)?'off':''}" data-act="newAt" data-date="${ds}" data-time="${pad(h)}:00"><span>${pad(h)}:00</span></div>`;
 const ev=timed.map(it=>{const s=toMin(it.time);let e=it.end?toMin(it.end):s+(it.type==='event'?60:30);if(e<=s)e=s+30;return{it,s,e};}).sort((a,b)=>a.s-b.s);
 const lanes=[];ev.forEach(x=>{let l=lanes.findIndex(end=>end<=x.s);if(l<0){l=lanes.length;lanes.push(0);}lanes[l]=x.e;x.l=l;});
 ev.forEach(x=>{x.n=1+Math.max(...ev.filter(y=>y.s<x.e&&y.e>x.s).map(y=>y.l));});
 const blocks=ev.map(x=>{const c=catOf(x.it.cat);const col=c?c.color:x.it.area==='biz'?'#f2c200':'#0a84ff';const w=`calc((100% - 62px) / ${x.n})`;
  return`<div class="ev ${isDone(x.it,ds)?'done':''}" data-act="edit" data-id="${x.it.id}" data-date="${ds}" style="top:${x.s/60*H+1}px;height:${Math.max((x.e-x.s)/60*H-2,22)}px;left:calc(54px + ${w} * ${x.l});width:calc(${w} - 4px);right:auto;background:${col}22;border-color:${col}">${(x.e-x.s)<45?`<b>${x.it.time} ${esc(x.it.title)}</b>`:`<b>${esc(x.it.title)}</b><span class="small">${x.it.time}${x.it.end?'–'+x.it.end:''}${x.it.client?' · '+esc(x.it.client):''}</span>`}</div>`;}).join('');
 const nowM=new Date().getHours()*60+new Date().getMinutes();
 const now=ds===todayStr()?`<div class="now" style="top:${nowM/60*H}px"></div>`:'';
 return`${untimed.length?`<div class="dayh"><span>Todo el día / sin hora</span></div>${listCard(untimed.map(it=>rowHTML(it,ds)),'')}<div style="height:12px"></div>`:''}<div class="tl" id="tl">${hrs}${blocks}${now}</div><p class="hint">Toca una hora libre para crear algo a esa hora.</p>`;}
function scrollTimeline(){const tl=$('#tl');if(!tl)return;const ds=S.cursor;const h=ds===todayStr()?Math.max(new Date().getHours()-1,0):(toMin(S.settings.workStart)||420)/60;requestAnimationFrame(()=>{const y=tl.getBoundingClientRect().top+window.scrollY+h*56-140;window.scrollTo({top:Math.max(y,0)});});}
function vAno(){const y=parseYmd(S.cursor).getFullYear();const t=todayStr();let out='';
 const cnt={};const a=new Date(y,0,1),b=new Date(y,11,31);for(let d=new Date(a);d<=b;d=addDays(d,1)){const ds=ymd(d);const n=itemsOn(ds).length;if(n)cnt[ds]=n;}
 for(let m=0;m<12;m++){const f=new Date(y,m,1);const off=(f.getDay()+6)%7;const days=new Date(y,m+1,0).getDate();let g=DOWS.map(d=>`<span class="muted" style="font-weight:600">${d}</span>`).join('');
  for(let i=0;i<off;i++)g+='<span></span>';
  for(let d=1;d<=days;d++){const ds=y+'-'+pad(m+1)+'-'+pad(d);const n=cnt[ds]||0;const st=n&&ds!==t?`background:color-mix(in srgb,var(--acc) ${Math.min(18+n*16,85)}%,transparent);${n>2?'color:#fff;':''}`:'';g+=`<span class="${ds===t?'t':''}" style="${st}" data-act="openDay" data-date="${ds}">${d}</span>`;}
  out+=`<div class="ym"><h4 data-act="openMonth" data-date="${y}-${pad(m+1)}-01">${MON[m]}</h4><div class="g">${g}</div></div>`;}
 const tot=Object.values(cnt).reduce((a,b)=>a+b,0);
 return`<p class="small muted" style="margin:0 2px 10px">${tot} elementos programados en ${y}. Toca un mes o un día.</p><div class="ygrid">${out}</div>`;}

function vTareas(){const t=todayStr();const f=S.tf;
 const fs=[['hoy','Hoy'],['proximas','Próximas'],['bandeja','Sin fecha'],['vencidas','Vencidas'],['todas','Todas'],['repetitivas','Repetitivas'],['hechas','Hechas']];
 let h=`<div class="chips">${fs.map(([k,l])=>`<button class="chip ${f===k?'on':''}" data-act="tf" data-v="${k}">${l}</button>`).join('')}</div>`;

 const cf=it=>!S.catF||it.cat===S.catF;
 if(f==='hoy'){const od=overdue().filter(cf);const td=itemsOn(t).filter(cf);
  if(od.length)h+=`<div class="dayh" style="color:var(--red)"><span>Vencidas</span></div>`+listCard(od.map(it=>rowHTML(it,it.date,{showDate:1})),'');
  h+=`<div class="dayh today"><span>Hoy</span></div>`+listCard(td.map(it=>rowHTML(it,t,{timeCol:1})),'Nada para hoy 🎉');}
 else if(f==='proximas'){let any=false;for(let k=0;k<45;k++){const ds=ymd(addDays(new Date(),k));const its=itemsOn(ds).filter(cf);if(!its.length)continue;any=true;h+=`<div class="dayh ${k===0?'today':''}"><span>${esc(relDay(ds))}${k>1?' · '+parseYmd(ds).getDate()+' '+MON[parseYmd(ds).getMonth()].slice(0,3):''}</span></div>`+listCard(its.map(it=>rowHTML(it,ds,{timeCol:1})),'');}if(!any)h+=listCard([],'Nada en los próximos 45 días');}
 else if(f==='bandeja'){h+=`<p class="hint">Ideas y cosas por hacer sin fecha. Ponles día cuando lo sepas.</p>`+listCard(inbox().filter(cf).map(it=>rowHTML(it,'')),'Bandeja vacía');}
 else if(f==='vencidas'){const od=overdue().filter(cf);h+=(od.length?`<div style="margin:12px 0"><button class="btn sec2" data-act="moveOverdue">Pasar todas a hoy</button></div>`:'')+listCard(od.map(it=>rowHTML(it,it.date,{showDate:1})),'Nada vencido 👏');}
 else if(f==='todas'){const its=S.items.filter(it=>areaOk(it)&&cf(it)&&!isRec(it)&&!it.done).sort((a,b)=>(a.date||'9')<(b.date||'9')?-1:(a.date||'9')>(b.date||'9')?1:byTime(a,b));h+=listCard(its.map(it=>rowHTML(it,it.date,{showDate:1})),'No hay nada pendiente');}
 else if(f==='repetitivas'){const its=S.items.filter(it=>areaOk(it)&&cf(it)&&isRec(it));h+=listCard(its.map(it=>rowHTML(it,'',{})).map((r,i)=>r.replace('<div class="rm">',`<div class="rm"><span>🔁 ${esc(REP[its[i].rep])}${its[i].time?' · '+its[i].time:''}</span>`)),'Sin elementos repetitivos');}
 else if(f==='hechas'){const its=S.items.filter(it=>areaOk(it)&&cf(it)&&!isRec(it)&&it.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)).slice(0,150);h+=(its.length?`<div style="margin:12px 0"><button class="btn red" data-act="clearDone">Borrar completadas</button></div>`:'')+listCard(its.map(it=>rowHTML(it,it.date,{showDate:1})),'Aún no has completado nada');}

 for(let k=6;k>=0;k--){const ds=ymd(addDays(t0,-k));let n=0;S.items.forEach(it=>{if(isRec(it)){if(it.doneDates&&it.doneDates.includes(ds))n++;}else if(it.done&&it.doneAt&&ymd(new Date(it.doneAt))===ds)n++;});days.push([ds,n]);}

 const pend=S.items.filter(it=>!isRec(it)&&!it.done&&it.type!=='event');
 const m0=ymd(new Date(t0.getFullYear(),t0.getMonth(),1)),m1=ymd(new Date(t0.getFullYear(),t0.getMonth()+1,0));

function openEditor(it,ds){const isNew=!S.items.some(x=>x.id===it.id);ED={it:JSON.parse(JSON.stringify(it)),ds:ds||it.date,isNew};renderEditor();}
function renderEditor(){const it=ED.it;const s=S.settings;const opt=(o,v)=>Object.entries(o).map(([k,l])=>`<option value="${k}" ${String(v)===k?'selected':''}>${esc(l)}</option>`).join('');
 const cats=s.cats.filter(c=>c.area===it.area);
 const mapQ=encodeURIComponent(it.addr||'');
 openSheet(`<div class="sh"><button data-act="edCancel">Cancelar</button><b>${ED.isNew?'Nuevo':'Editar'}</b><button class="save" data-act="edSave">${ED.isNew?'Añadir':'Guardar'}</button></div><div class="sb">
 <div class="fg"><div class="fr"><input class="big" id="e_title" placeholder="Título" value="${esc(it.title)}" autocomplete="off"></div>
 <div class="fr"><div class="seg">${[['task','Tarea'],['event','Evento / Cita']].map(([k,l])=>`<button class="${it.type===k?'on':''}" data-act="edF" data-f="type" data-v="${k}">${l}</button>`).join('')}</div></div>
 <div class="fr"><div class="seg">${[['per','🏠 Personal'],['biz','💼 '+areaName('biz')]].map(([k,l])=>`<button class="${it.area===k?'on':''}" data-act="edF" data-f="area" data-v="${k}">${esc(l)}</button>`).join('')}</div></div></div>
 <div class="fg">
 <div class="fr"><label>Fecha</label><input type="date" id="e_date" value="${it.date}">${it.date?'<button class="x" data-act="edClearDate">✕</button>':''}</div>
 ${it.date?`<div class="fr"><label>Todo el día</label><label class="sw"><input type="checkbox" id="e_allday" ${it.allDay?'checked':''}><i></i></label></div>
 ${!it.allDay?`<div class="fr"><label for="e_time">Hora inicio</label><input type="time" id="e_time" value="${it.time}"></div><div class="fr"><label for="e_end">Hora fin</label><input type="time" id="e_end" value="${it.end}"></div>`:''}
 <div class="fr"><label>Repetir</label><select id="e_rep">${opt(REP,it.rep||'none')}</select></div>
 ${isRec(it)?`<div class="fr"><label>Hasta</label><input type="date" id="e_until" value="${it.until||''}"></div>`:''}`:'<div class="fr"><label class="muted small">Sin fecha: irá a la bandeja “Sin fecha”</label></div>'}
 </div>
 <div class="flbl">🔔 Aviso</div><div class="fg"><div class="remgrid">${REMQ.map(([k,l])=>`<button class="${k<0?'off ':''}${(it.remind==null?-1:it.remind)===k?'on':''}" data-act="edF" data-f="remind" data-v="${k}">${l}</button>`).join('')}</div><div class="remhint">${remHint(it)}</div></div>
 <div class="fg"><div class="fr"><label>Prioridad</label><div class="seg" style="max-width:62%">${PRIO.map((l,i)=>`<button class="${(it.prio||0)===i?'on':''}" data-act="edF" data-f="prio" data-v="${i}">${i?'!'.repeat(i):'—'}</button>`).join('')}</div></div>
 <div class="fr"><label>Categoría</label><select id="e_cat"><option value="">Ninguna</option>${cats.map(c=>`<option value="${c.id}" ${it.cat===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div></div>
 ${it.area==='biz'?`<div class="flbl">Datos del trabajo</div><div class="fg">
 <div class="fr"><label>Cliente</label><input id="e_client" value="${esc(it.client)}" placeholder="Nombre"></div>
 <div class="fr"><label>Dirección</label><input id="e_addr" value="${esc(it.addr)}" placeholder="Calle, nº, localidad"></div>
 <div class="fr"><label>Teléfono</label><input id="e_phone" type="tel" value="${esc(it.phone)}" placeholder="600 000 000"></div>
 <div class="fr"><label>Importe (€)</label><input id="e_amount" type="number" inputmode="decimal" step="0.01" value="${esc(it.amount)}" placeholder="0,00"></div></div>
 ${(it.addr||it.phone)?`<div class="ext">${it.addr?`<a href="https://maps.apple.com/?q=${mapQ}" target="_blank" rel="noopener">📍 Abrir en Mapas</a><a href="https://www.google.com/maps/search/?api=1&query=${mapQ}" target="_blank" rel="noopener">Google Maps</a>`:''}${it.phone?`<a href="tel:${esc(it.phone.replace(/\s/g,''))}">📞 ${esc(it.phone)}</a><a href="https://wa.me/${esc((it.phone.replace(/\D/g,'').length===9?'34':'')+it.phone.replace(/\D/g,''))}" target="_blank" rel="noopener">WhatsApp</a>`:''}</div>`:''}`:''}
 <div class="flbl">Subtareas / checklist</div><div class="fg" id="e_subs">${(it.subs||[]).map((st,i)=>`<div class="sub ${st.d?'done':''}"><button class="chk" data-act="subT" data-i="${i}"></button><input type="text" data-sub="${i}" value="${esc(st.t)}"><button class="x" data-act="subDel" data-i="${i}">✕</button></div>`).join('')}
 <div class="sub"><span style="color:var(--acc);font-size:20px;width:20px;text-align:center">＋</span><input type="text" id="e_newsub" placeholder="Añadir paso (Enter)" enterkeyhint="enter"></div></div>
 <div class="flbl">Notas</div><div class="fg"><div class="fr"><textarea id="e_notes" placeholder="Detalles, medidas, material necesario…">${esc(it.notes)}</textarea></div></div>
 ${!ED.isNew?`<div style="display:grid;gap:8px;margin-top:18px">
 ${isRec(it)&&ED.ds?`<button class="btn sec2 full" data-act="edSkip">Quitar solo el ${esc(relDay(ED.ds).toLowerCase())}</button>`:''}
 <button class="btn sec2 full" data-act="edDup">Duplicar</button>
 <button class="btn sec2 full" data-act="edTomorrow">Mover a mañana</button>
 <button class="btn red full" data-act="edDel">${isRec(it)?'Eliminar toda la serie':'Eliminar'}</button></div>
 <p class="hint" style="text-align:center">Creado ${new Date(it.created).toLocaleString('es-ES',{dateStyle:'medium',timeStyle:'short'})}</p>`:''}
 </div>`);
 if(ED.isNew&&!it.title)setTimeout(()=>{const t=$('#e_title');t&&t.focus();},320);
}
function readEditor(){if(!ED)return;const it=ED.it;const v=id=>{const e=$('#'+id);return e?e.value:undefined;};
 const set=(k,id)=>{const x=v(id);if(x!==undefined)it[k]=x;};
 set('title','e_title');set('notes','e_notes');set('client','e_client');set('addr','e_addr');set('phone','e_phone');set('amount','e_amount');set('cat','e_cat');set('until','e_until');
 const nd=v('e_date');if(nd!==undefined){if(nd&&!it.date&&(it.remind==null||it.remind<0))it.remind=0;it.date=nd;}
 const ad=$('#e_allday');if(ad)it.allDay=ad.checked;
 const nt=v('e_time');if(nt!==undefined){if(nt&&!it.time&&it.remind===0)it.remind=S.settings.defRemind;it.time=nt;}
 set('end','e_end');const r=v('e_rep');if(r!==undefined)it.rep=r;const rm=v('e_rem');if(rm!==undefined)it.remind=+rm;
 document.querySelectorAll('[data-sub]').forEach(e=>{const i=+e.dataset.sub;if(it.subs[i])it.subs[i].t=e.value;});
 const ns=$('#e_newsub');if(ns&&ns.value.trim()){it.subs.push({t:ns.value.trim(),d:false});ns.value='';}
 if(!it.date){it.time='';it.end='';it.rep='none';}
}
function saveEditor(){readEditor();const it=ED.it;if(!it.title.trim()){toast('Ponle un título');$('#e_title')&&$('#e_title').focus();return;}
 it.title=it.title.trim();if(it.time&&it.end&&toMin(it.end)<=toMin(it.time))it.end='';
 if(it.subs.length&&it.subs.every(s=>s.d)&&!isRec(it)&&!it.done){it.done=true;it.doneAt=Date.now();}
 // reprogramar avisos si cambia la hora
 Object.keys(fired).forEach(k=>{if(k.startsWith(it.id+'|'))delete fired[k];});lsSet('agp_fired',fired);
 Store.putItem(it);closeSheet();toast(ED&&ED.isNew?'Añadido':'Guardado');}

/* ================= acciones ================= */
function toggleDone(id,ds){const it=S.items.find(x=>x.id===id);if(!it)return;const prev=JSON.parse(JSON.stringify(it));
 if(isRec(it)){ds=ds||todayStr();it.doneDates=it.doneDates||[];const i=it.doneDates.indexOf(ds);if(i>=0)it.doneDates.splice(i,1);else{it.doneDates.push(ds);if(it.doneDates.length>400)it.doneDates=it.doneDates.slice(-400);}}
 else{it.done=!it.done;it.doneAt=it.done?Date.now():null;}
 Store.putItem(it);if(isDone(it,ds)){beepSoft();toast('Completada ✓',()=>Store.putItem(prev));}}
function beepSoft(){if(!S.settings.sound||!actx)return;try{actx.resume();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=1320;g.gain.setValueAtTime(.12,actx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.15);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+.16);}catch(e){}}
function snooze(id,ds,m){let at;if(m==='tom'){const it=S.items.find(x=>x.id===id);const d=addDays(new Date(),1);const[h,mi]=(S.settings.allDayHour||'09:00').split(':').map(Number);d.setHours(h,mi,0,0);at=d.getTime();if(it&&!isRec(it)&&it.type!=='event'&&it.date&&it.date<=todayStr()){it.date=ymd(d);Store.putItem(it);}}else at=Date.now()+(+m)*6e4;
 snoozes.push({id,ds,at});lsSet('agp_snooze',snoozes);toast('Te aviso '+(m==='tom'?'mañana':'en '+(m>=60?m/60+' h':m+' min')));}
let confirmCb=null;
function confirmBox(title,msg,okLabel,cb){confirmCb=cb;$('#mbox').innerHTML=`<h2>${esc(title)}</h2><p>${esc(msg)}</p><div class="acts"><button class="btn red full" data-act="cfOk">${esc(okLabel)}</button><button class="btn sec2 full" data-act="cfNo">Cancelar</button></div>`;$('#modal').classList.add('on');}
function promptBox(title,val,cb){confirmCb=cb;$('#mbox').innerHTML=`<h2>${esc(title)}</h2><textarea id="pv" style="width:100%;min-height:120px;border:.5px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);margin:10px 0">${esc(val)}</textarea><div class="acts"><button class="btn full" data-act="pfOk">Guardar</button><button class="btn sec2 full" data-act="cfNo">Cancelar</button></div>`;$('#modal').classList.add('on');}
async function getDL(){try{return window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(e){return null;}}
async function saveFile(name,data){const dl=await getDL();if(!dl){const type=name.endsWith('.csv')?'text/csv':'application/json';
 try{const f=new File([data],name,{type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return;}}catch(e){if(e&&e.name==='AbortError')return;}
 try{const u=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Archivo guardado');return;}catch(e){}
 try{await navigator.clipboard.writeText(data);toast('Copiado al portapapeles');}catch(e){toast('No se puede descargar aquí');}return;}
 try{await dl.save({filename:name,data});toast('Archivo guardado');}catch(e){if(e&&e.code==='declined')return;toast('No se pudo guardar el archivo');}}
function csvExport(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const rows=[['Título','Tipo','Área','Categoría','Fecha','Hora','Fin','Repetir','Prioridad','Hecho','Cliente','Dirección','Teléfono','Importe','Notas']];
 S.items.forEach(it=>rows.push([it.title,it.type==='event'?'Evento':'Tarea',areaName(it.area),(catOf(it.cat)||{}).name||'',it.date,it.time,it.end,REP[it.rep||'none'],PRIO[it.prio||0],it.done?'Sí':'No',it.client,it.addr,it.phone,it.amount,it.notes]));
 return '﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n');}
async function importJSON(file){try{const d=JSON.parse(await file.text());if(!d||!Array.isArray(d.items))throw 0;let n=0;
 for(const it of d.items){if(it&&it.id&&it.title){const i=S.items.findIndex(x=>x.id===it.id);if(i>=0)S.items[i]=it;else S.items.push(it);Store.write(Store.itemsCol,it.id,it);n++;}}
 for(const nt of(d.notes||[])){if(nt&&nt.id){const i=S.notes.findIndex(x=>x.id===nt.id);if(i>=0)S.notes[i]=nt;else S.notes.push(nt);Store.write(Store.notesCol,nt.id,nt);}}
 if(d.settings){S.settings=Object.assign(defaults(),d.settings);Store.putSettings();}
 Store.persist();render();toast('Restaurados '+n+' elementos');}catch(e){toast('Archivo no válido');}}

document.addEventListener('click',e=>{unlockAudio();
 if(e.target.id==='ov'){closeSheet();return;}
 const el=e.target.closest('[data-act]');if(!el)return;let act=el.dataset.act;const id=el.dataset.id,ds=el.dataset.date,v=el.dataset.v;
 if(act.startsWith('go:')){S.view=act.slice(3);render();window.scrollTo(0,0);return;}
 if(el.tagName==='A'&&el.getAttribute('href')==='#')e.preventDefault();
 switch(act){
 case'go':if(v==='buscar'){S.prevView=S.view;S._focusS=true;}S.view=v;render();window.scrollTo(0,0);break;
 case'area':S.area=v;S.catF='';render();break;
 case'calmode':S.cal=v;render();break;
 case'calnav':{const c=parseYmd(S.cursor),k=+v;S.cursor=ymd(S.cal==='dia'?addDays(c,k):S.cal==='semana'?addDays(c,7*k):S.cal==='mes'?addMonths(c,k):addMonths(c,12*k));render();break;}
 case'calToday':S.cursor=todayStr();render();break;
 case'pick':S.cursor=ds;render();break;
 case'pickw':S.cursor=ds;S.cal='dia';render();break;
 case'openDay':S.cursor=ds;S.view='cal';S.cal='dia';render();break;
 case'openMonth':S.cursor=ds;S.cal='mes';render();window.scrollTo(0,0);break;
 case'tf':S.tf=v;S.view='tareas';render();window.scrollTo(0,0);break;
 case'catF':S.catF=v;render();break;
 case'tpl':S.qtext=v;S._focusQ=true;render();break;
 case'toggle':toggleDone(id,ds);break;
 case'edit':{const it=S.items.find(x=>x.id===id);if(it)openEditor(it,ds);break;}
 case'newAt':openEditor(newItem({date:ds,time:el.dataset.time,type:'event',remind:S.settings.defRemind}),ds);break;
 case'newOn':openEditor(newItem({date:ds,remind:0}),ds);break;
 case'moveOverdue':{const t=todayStr();overdue().forEach(it=>{it.date=t;Store.putItem(it);});toast('Movidas a hoy');break;}
 case'clearDone':confirmBox('Borrar completadas','Se eliminarán las tareas ya hechas que se ven en esta lista.','Borrar',()=>{S.items.filter(it=>areaOk(it)&&!isRec(it)&&it.done).forEach(it=>Store.delItem(it.id));});break;
 // editor
 case'edCancel':closeSheet();break;
 case'edSave':saveEditor();break;
 case'edF':readEditor();ED.it[el.dataset.f]=(el.dataset.f==='prio'||el.dataset.f==='remind')?+v:v;if(el.dataset.f==='remind'&&+v>=0&&!ED.it.date)ED.it.date=todayStr();if(el.dataset.f==='area'){const c=catOf(ED.it.cat);if(c&&c.area!==v)ED.it.cat='';}if(el.dataset.f==='type'&&v==='event'&&ED.it.time&&!ED.it.end)ED.it.end=fromMin(Math.min(toMin(ED.it.time)+60,1439));renderEditor();break;
 case'edClearDate':readEditor();ED.it.date='';ED.it.time='';ED.it.end='';ED.it.rep='none';ED.it.remind=-1;renderEditor();break;
 case'subT':readEditor();ED.it.subs[+el.dataset.i].d=!ED.it.subs[+el.dataset.i].d;renderEditor();break;
 case'subDel':readEditor();ED.it.subs.splice(+el.dataset.i,1);renderEditor();break;
 case'edDel':{const it=ED.it;const prev=S.items.find(x=>x.id===it.id);closeSheet();if(prev){const copy=JSON.parse(JSON.stringify(prev));Store.delItem(it.id);toast('Eliminado',()=>Store.putItem(copy));}break;}
 case'edSkip':{readEditor();const it=ED.it;it.skip=it.skip||[];it.skip.push(ED.ds);Store.putItem(it);closeSheet();toast('Quitado ese día');break;}
 case'edDup':{readEditor();const c=JSON.parse(JSON.stringify(ED.it));c.id=newId();c.created=Date.now();c.done=false;c.doneDates=[];c.title+=' (copia)';closeSheet();openEditor(c,c.date);break;}
 case'edTomorrow':{readEditor();const it=ED.it;it.date=ymd(addDays(it.date&&it.date>todayStr()?parseYmd(it.date):new Date(),1));it.rep=isRec(it)?it.rep:'none';Store.putItem(it);closeSheet();toast('Movido a '+relDay(it.date).toLowerCase());break;}
 // alertas
 case'alDone':{const it=S.items.find(x=>x.id===id);if(it&&!isDone(it,ds))toggleDone(id,ds);nextAlert();break;}
 case'alSnooze':snooze(id,ds,el.dataset.m);nextAlert();break;
 case'alOpen':{nextAlert();const it=S.items.find(x=>x.id===id);if(it)openEditor(it,ds);break;}
 case'alClose':nextAlert();break;
 case'cfOk':$('#modal').classList.remove('on');if(confirmCb)confirmCb();confirmCb=null;break;
 case'pfOk':{const val=$('#pv').value;$('#modal').classList.remove('on');if(confirmCb)confirmCb(val);confirmCb=null;break;}
 case'cfNo':$('#modal').classList.remove('on');confirmCb=null;break;
 case'undo':if(undoFn){undoFn();undoFn=null;}$('#toast').classList.remove('on');break;
 // notas
 case'addNote':{const t=$('#nin').value.trim();if(!t){toast('Escribe la nota');break;}Store.putNote({id:newId(),text:t,area:$('#narea').value,pinned:false,created:Date.now()});toast('Nota guardada');break;}
 case'pinNote':{const n=S.notes.find(x=>x.id===id);if(n){n.pinned=!n.pinned;Store.putNote(n);}break;}
 case'delNote':{const n=S.notes.find(x=>x.id===id);if(n){const c=JSON.parse(JSON.stringify(n));Store.delNote(id);toast('Nota borrada',()=>Store.putNote(c));}break;}
 case'editNote':{const n=S.notes.find(x=>x.id===id);if(n)promptBox('Editar nota',n.text,val=>{if(val.trim()){n.text=val.trim();Store.putNote(n);}});break;}
 case'noteToTask':{const n=S.notes.find(x=>x.id===id);if(n){const p=parseQuick(n.text.split('\n')[0]);openEditor(newItem(Object.assign(p,{area:n.area,notes:n.text.includes('\n')?n.text:'',title:p.title.slice(0,120)})),p.date);}break;}
 // más
 case'testAlert':unlockAudio();setTimeout(beep,50);toast('🔔 Así sonarán los avisos');break;
 case'logoUp':$('#logoIn').click();break;
 case'logoDel':S.settings.logo='';Store.putSettings();render();break;
 case'backup':saveFile('agenda-copia-'+todayStr()+'.json',JSON.stringify({app:'Agenda Pro',version:1,exported:new Date().toISOString(),items:S.items,notes:S.notes,settings:S.settings},null,1));break;
 case'restore':$('#fileIn').click();break;
 case'csv':saveFile('agenda-'+todayStr()+'.csv',csvExport());break;
 case'notifPerm':try{if(!('Notification'in window)){toast('Primero instala la app en la pantalla de inicio (iOS 16.4 o superior)');break;}Notification.requestPermission().then(p=>toast(p==='granted'?'Notificaciones activadas':'No se activaron')).catch(()=>toast('No disponible aquí'));}catch(err){toast('No disponible aquí');}break;
 case'catAdd':S.settings.cats.push({id:'c_'+newId(),name:'Nueva categoría',area:S.area==='per'?'per':'biz',color:CAT_COLORS[S.settings.cats.length%CAT_COLORS.length]});Store.putSettings();render();break;
 case'catDel':{const c=catOf(id);confirmBox('Borrar categoría','“'+(c?c.name:'')+'” se quitará de sus tareas (las tareas no se borran).','Borrar',()=>{S.settings.cats=S.settings.cats.filter(x=>x.id!==id);Store.putSettings();S.items.filter(it=>it.cat===id).forEach(it=>{it.cat='';Store.putItem(it);});render();});break;}
 case'catArea':{const c=catOf(id);if(c){c.area=c.area==='biz'?'per':'biz';Store.putSettings();render();}break;}
 case'catColor':{const c=catOf(id);if(c){c.color=CAT_COLORS[(CAT_COLORS.indexOf(c.color)+1)%CAT_COLORS.length];Store.putSettings();render();}break;}
 case'wipe':confirmBox('¿Borrar todo?','Se eliminarán todas tus tareas, eventos y notas. Haz antes una copia de seguridad.','Borrar todo',()=>{S.items.slice().forEach(it=>Store.delItem(it.id));S.notes.slice().forEach(n=>Store.delNote(n.id));toast('Datos borrados');});break;
 }
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.dataset.form;
 if(f==='quick'){const v=$('#qin').value;if(v.trim()){addQuick(v);S.qtext='';S._focusQ=true;render();}}
 if(f==='search'){const i=$('#sin');i&&i.blur();}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='qin'){S.qtext=t.value;const p=t.value?parseQuick(t.value):null;const box=t.closest('.quick').nextElementSibling;if(box&&p){const pv=quickPreview(p);if(pv.length){box.className='qprev';box.innerHTML=pv.map(x=>`<span>${esc(x)}</span>`).join('');}}return;}
 if(t.id==='sin'){S.search=t.value;S._focusS=true;render();return;}
 if(t.dataset.set&&t.type!=='checkbox'&&t.tagName==='INPUT'&&t.type==='text'){S.settings[t.dataset.set]=t.value;Store.putSettings();return;}
 if(t.dataset.cat){const c=catOf(t.dataset.cat);if(c){c.name=t.value;Store.putSettings();}}
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.set){const k=t.dataset.set;S.settings[k]=t.type==='checkbox'?t.checked:(k==='defRemind'?+t.value:t.value);Store.putSettings();if(t.type!=='text')render();return;}
 if(ED&&['e_date','e_allday','e_rep','e_time'].includes(t.id)){readEditor();renderEditor();}
 if(t.id==='fileIn'&&t.files[0]){importJSON(t.files[0]);t.value='';}
 if(t.id==='logoIn'&&t.files[0]){loadLogo(t.files[0]);t.value='';}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='e_newsub'){e.preventDefault();readEditor();renderEditor();setTimeout(()=>{const n=$('#e_newsub');n&&n.focus();},30);}
 if(e.key==='Escape'){if($('#modal').classList.contains('on')&&!alertOn)$('#modal').classList.remove('on');else if(ED)closeSheet();}});
$('#fab').addEventListener('click',()=>{const ds=S.view==='cal'?S.cursor:todayStr();if(S.view==='notas'){const n=$('#nin');n&&n.focus();return;}openEditor(newItem({date:S.view==='tareas'&&S.tf==='bandeja'?'':ds,remind:S.view==='tareas'&&S.tf==='bandeja'?-1:0}),ds);});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);}catch(e){}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkReminders();if(S.view!=='buscar'&&!ED)render();}});

/* ================= arranque ================= */
Store.loadLocal();S.settings.cats.forEach(c=>{if(c.color==='#ff9f0a')c.color='#f2c200';});applyTheme();render();
setInterval(()=>{checkReminders();},20000);
setInterval(()=>{if(!ED&&!document.hidden&&(S.view==='hoy'||S.view==='cal')&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))render();},60000);
setTimeout(checkReminders,1500);
initCloud();
if(STANDALONE){try{if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').then(r=>{SWREG=r;}).catch(()=>{});}catch(e){}
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}}
